<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Deep Quiet Precision Dark Background -->
    <radialGradient id="bg-radial" cx="50%" cy="38%" r="68%" fx="50%" fy="28%">
      <stop offset="0%" stop-color="#1c2029" />
      <stop offset="52%" stop-color="#111318" />
      <stop offset="100%" stop-color="#090a0d" />
    </radialGradient>

    <!-- Subtle Ambient Core Glow (Warm Amber + Emerald balance) -->
    <radialGradient id="amber-glow" cx="56%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0c0d10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emerald-glow" cx="42%" cy="60%" r="38%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0c0d10" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Bezel Ring Gradient -->
    <linearGradient id="bezel-rim" x1="180" y1="140" x2="844" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.18" />
    </linearGradient>

    <!-- Tokio Orbital Ring Gradient -->
    <linearGradient id="orbit-grad" x1="200" y1="680" x2="824" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95" />
    </linearGradient>

    <!-- North-East Amber Needle (Light Facet) -->
    <linearGradient id="needle-amber-light" x1="512" y1="512" x2="692" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- North-East Amber Needle (Deep Facet) -->
    <linearGradient id="needle-amber-dark" x1="512" y1="512" x2="692" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- South-West Counter-Needle (Precision Emerald / Graphite Facets) -->
    <linearGradient id="needle-south-light" x1="512" y1="512" x2="332" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272b36" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="needle-south-dark" x1="512" y1="512" x2="332" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181b22" />
      <stop offset="70%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Drop Shadow for Floating Needle -->
    <filter id="needle-shadow" x="180" y="180" width="664" height="664" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="4" dy="-4" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. Canvas Base -->
  <rect width="1024" height="1024" fill="url(#bg-radial)" />
  <circle cx="512" cy="512" r="460" fill="url(#amber-glow)" />
  <circle cx="512" cy="512" r="460" fill="url(#emerald-glow)" />

  <!-- 2. Outer Safe-Zone Dial Chassis (Perfect inside Telegram circular avatar mask) -->
  <circle cx="512" cy="512" r="420" fill="#12141a" fill-opacity="0.55" stroke="url(#bezel-rim)" stroke-width="3" />
  <circle cx="512" cy="512" r="356" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 14" />
  <circle cx="512" cy="512" r="284" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.75" />

  <!-- 3. Precision Cardinal & Intercardinal Calibration Ticks -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- North -->
    <line x1="512" y1="118" x2="512" y2="150" stroke-opacity="0.45" stroke-width="4" />
    <!-- South -->
    <line x1="512" y1="874" x2="512" y2="906" stroke-opacity="0.25" stroke-width="4" />
    <!-- East -->
    <line x1="874" y1="512" x2="906" y2="512" stroke-opacity="0.45" stroke-width="4" />
    <!-- West -->
    <line x1="118" y1="512" x2="150" y2="512" stroke-opacity="0.25" stroke-width="4" />

    <!-- 45-degree Ticks -->
    <line x1="768" y1="256" x2="788" y2="236" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="3.5" />
    <line x1="256" y1="768" x2="236" y2="788" stroke="#10b981" stroke-opacity="0.6" stroke-width="3.5" />
    <line x1="256" y1="256" x2="236" y2="236" stroke-opacity="0.18" stroke-width="3" />
    <line x1="768" y1="768" x2="788" y2="788" stroke-opacity="0.18" stroke-width="3" />
  </g>

  <!-- 4. Tokio Tilted Levitation Orbit Ring -->
  <g transform="rotate(-32 512 512)">
    <ellipse cx="512" cy="512" rx="348" ry="132" stroke="url(#orbit-grad)" stroke-width="4.5" />
    <ellipse cx="512" cy="512" rx="348" ry="132" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="14" />
    <!-- Orbital Satellite Nodes (Micro-Step & Balance Anchors) -->
    <circle cx="860" cy="512" r="11" fill="#fbbf24" />
    <circle cx="860" cy="512" r="22" fill="#f59e0b" fill-opacity="0.25" />
    <circle cx="164" cy="512" r="9" fill="#10b981" />
    <circle cx="164" cy="512" r="18" fill="#10b981" fill-opacity="0.22" />
  </g>

  <!-- 5. Inner Horizon Crosshair -->
  <line x1="512" y1="210" x2="512" y2="814" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
  <line x1="210" y1="512" x2="814" y2="512" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- 6. Main 3D Faceted Compass Needle (45° North-East Ascent) -->
  <g filter="url(#needle-shadow)">
    <!-- South-West Tail (Emerald / Graphite Anchor) -->
    <polygon points="512,512 454,454 292,732" fill="url(#needle-south-light)" />
    <polygon points="512,512 570,570 292,732" fill="url(#needle-south-dark)" />

    <!-- North-East Pointer (Warm Amber / Gold Vector) -->
    <polygon points="512,512 454,454 732,292" fill="url(#needle-amber-light)" />
    <polygon points="512,512 570,570 732,292" fill="url(#needle-amber-dark)" />

    <!-- Crisp Specular Ridge Line -->
    <line x1="292" y1="732" x2="732" y2="292" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <!-- 7. Center Tokio Core Pivot -->
  <circle cx="512" cy="512" r="34" fill="#0c0d10" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />
  <circle cx="512" cy="512" r="14" fill="#fbbf24" />
  <circle cx="508" cy="508" r="4.5" fill="#ffffff" fill-opacity="0.9" />
</svg>
