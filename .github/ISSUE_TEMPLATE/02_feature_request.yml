name: "✨ Feature Request"
description: Suggest an idea or enhancement for Tokio.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions and ideas for improving Tokio!
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area does this feature relate to?
      options:
        - Task Management & Focus
        - Multicurrency Finances & Liabilities
        - Notes & Knowledge Graph
        - Telegram Bot UX & Formatting
        - Telegram Mini App (TMA UI)
        - Overlay & Localization (i18n)
        - AI Agent & Tools
        - Developer Experience & Security Tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific problem or friction you encounter?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision the feature working (and whether it belongs in Core vs. Overlay).
      placeholder: It would be great if...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or workarounds you have considered?
